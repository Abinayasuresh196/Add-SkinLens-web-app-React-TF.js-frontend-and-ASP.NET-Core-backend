<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check a dermoscopy image of a skin lesion against 7 lesion types. Runs in your browser." />
    <link rel="icon" type="image/svg+xml" href="/lens.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash (light by default)
      try {
        var t = localStorage.getItem('skinlens.theme-choice');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <title>SkinLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
